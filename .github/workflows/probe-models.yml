name: Probe models
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One minimal generateContent call per model (status only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for m in gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.8-flash \
                   gemini-flash-latest gemini-3-flash-preview gemini-3.5-flash-lite \
                   gemini-3.1-flash-lite gemini-3.1-flash-lite-preview gemini-flash-lite-latest \
                   gemini-4-carbon gemini-4-hydrogen gemini-4-argon gemini-pro-latest \
                   gemini-3.1-pro-preview gemini-omni-1.2-flash gemini-2.5-flash-lite gemini-2.5-pro; do
            for attempt in 1 2; do
              code=$(curl -s -o r.json -w '%{http_code}' -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent" \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'Content-Type: application/json' \
                -d '{"contents":[{"parts":[{"text":"Reply with OK"}]}]}')
              st=$(jq -r '.error.status // "OK"' r.json 2>/dev/null || echo "?")
              [ "$code" = "200" ] && break
              sleep 3
            done
            echo "PROBE ${m} ${code} ${st}"
          done
